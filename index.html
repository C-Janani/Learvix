<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learvix – Personalized Learning Copilot</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-950 overflow-hidden">

  <!-- Background Gradient -->
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900"></div>

  <!-- Floating Blobs -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl animate-float"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-cyan-400/10 rounded-full blur-3xl animate-float" style="animation-delay: -3s;"></div>

  <!-- Main Card -->
  <div class="relative z-10 w-full max-w-md bg-white/5 backdrop-blur-xl rounded-2xl p-8 shadow-xl border border-white/10">

    <h1 class="text-3xl font-bold text-white text-center mb-2">
      Learvix
    </h1>

    <p class="text-gray-300 text-center mb-6">
      Personalized Learning Copilot for Core Courses
    </p>

    <form class="space-y-4">
      <input
        type="text"
        placeholder="Enter topic to learn"
        class="w-full px-4 py-3 rounded-xl bg-white/10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
      />

      <button
        type="submit"
        class="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-700 transition text-white font-semibold"
      >
        Start Learning
      </button>
    </form>

  </div>

</body>
</html>
